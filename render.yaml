services:
  # Backend API (NestJS)
  - type: web
    name: devlog-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false # Example: https://devlog-web.onrender.com
      - key: DATABASE_URL
        sync: false # Neon pooled URL (for app runtime)
      - key: DIRECT_URL
        sync: false # Neon direct URL (for Prisma migrate)
      - key: REDIS_URL
        sync: false # Paste Render Key Value internal URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRATION_TIME
        value: "900"
      - key: JWT_REFRESH_TOKEN_EXPIRATION_TIME
        value: "604800"
      # Google strategy in current code uses getOrThrow, so these must exist.
      - key: GOOGLE_CLIENT_ID
        value: replace-me-google-client-id
      - key: GOOGLE_CLIENT_SECRET
        value: replace-me-google-client-secret
      - key: GOOGLE_REDIRECT_URI
        sync: false # Example: https://devlog-api.onrender.com/api/auth/google/callback

  # Frontend (Vite static)
  - type: web
    name: devlog-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Example: https://devlog-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Redis-compatible cache (Render Key Value / Valkey)
  - type: keyvalue
    name: devlog-cache
    region: singapore
    plan: free
    ipAllowList: [] # Internal connections only
